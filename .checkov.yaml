framework:
  - terraform
skip-check:
  - CKV_AWS_117   # Lambda in VPC: needs NAT/endpoints, excluded for cost
  - CKV_AWS_50    # X-Ray: needs wildcard-resource permission, conflicts with least privilege
  - CKV_AWS_115   # Reserved concurrency: can fail on new-account limits
  - CKV_AWS_272   # Code signing: out of scope for a demo function
  - CKV_AWS_116   # DLQ: async invokes only; function is invoked directly
  - CKV_AWS_173   # Env var holds a parameter name, not a secret
  - CKV_AWS_252   # CloudTrail SNS: no notification requirement
  - CKV2_AWS_10   # CloudTrail to CloudWatch Logs: extra cost, out of scope
  - CKV2_AWS_62   # S3 event notifications: not needed for a log bucket
  - CKV_AWS_144   # Cross-region replication: cost, out of scope
  - CKV_AWS_18    # Access logging on the log bucket creates a loop
  - CKV_AWS_35    # DEFERRED: customer-managed KMS key for CloudTrail planned
  - CKV_AWS_158   # DEFERRED: customer-managed KMS key for log group planned
  - CKV_AWS_145   # DEFERRED: customer-managed KMS key for S3 bucket planned